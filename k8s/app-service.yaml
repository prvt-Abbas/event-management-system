apiVersion: v1
kind: Service
metadata:
  name: event-app
  labels:
    app: event-app
spec:
  type: NodePort
  selector:
    app: event-app
  ports:
    - port: 5000
      targetPort: 5000
      # Fixed NodePort so the EC2 security group rule is stable.
      # App URL: http://<EC2-PUBLIC-IP>:30007
      # (On the host, minikube's NodePort is reachable via the
      # minikube node; if 30007 does not respond from outside, use
      # the Task 3 fallback in README: kubectl port-forward.)
      nodePort: 30007
